name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:0.6.8
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_EVAL_EMBEDDING_MODEL: nomic-embed-text:v1.5
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,evaluation]"
      - name: Pull pinned local evaluation models
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS -X POST http://localhost:11434/api/pull \
            -d '{"name":"llama3.2:3b","stream":false}' >/dev/null
          curl -fsS -X POST http://localhost:11434/api/pull \
            -d '{"name":"nomic-embed-text:v1.5","stream":false}' >/dev/null
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy backend
      - name: Run database migrations
        run: alembic upgrade head
      - name: Test
        run: pytest --ignore=tests/golden
      - name: Golden and determinism evaluation
        env:
          RUN_LIVE_GOLDEN: "1"
        run: pytest tests/golden -q
      - name: Ragas evaluation
        run: python tests/eval/run_ragas.py
      - name: Verify end-to-end Langfuse trace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.LANGFUSE_PUBLIC_KEY != '' && env.LANGFUSE_SECRET_KEY != ''
        run: python tests/eval/verify_langfuse_trace.py
      - name: Security scan
        run: bandit -r backend
      - name: Dependency audit
        run: >-
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-2447
          --ignore-vuln PYSEC-2026-3046
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend Lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend Test
        run: npm test
        working-directory: frontend
      - name: Frontend Build
        run: npm run build
        working-directory: frontend
      - name: Validate Docker Compose configuration
        run: docker compose config
      - name: Validate Docker build
        run: docker build -f docker/Dockerfile -t clinical-discharge-api:ci .