[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clinical-discharge-intelligence-system"
version = "0.1.0"
description = "A guideline-grounded clinical discharge review system."
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1.0",
    "faiss-cpu>=1.8,<2.0",
    "numpy>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "pypdf>=5.0,<7.0",
    "pydantic>=2.9,<3.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "streamlit>=1.40,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.8,<1.0",
    "types-defusedxml>=0.7,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = '(^|/)(\.venv|build|dist)/'
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.setuptools.packages.find]
include = ["backend*", "knowledge_base*"]