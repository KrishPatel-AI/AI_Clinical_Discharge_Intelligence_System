[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clinical-discharge-intelligence-system"
version = "0.1.0"
description = "A guideline-grounded clinical discharge review system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "streamlit>=1.40,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = '(^|/)(\.venv|build|dist)/'

[tool.setuptools.packages.find]
include = ["backend*"]